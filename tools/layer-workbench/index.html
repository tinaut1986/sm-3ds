<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Super Metroid 3DS: layer workbench</title>
<style>
  :root { --bg:#0d1118; --panel:#1b2130; --edge:#33405c; --text:#d5deef; --dim:#8091b0; --accent:#ffd54a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui,sans-serif; height:100vh; overflow:hidden; }
  button, select, input[type=text] { background:#26304a; color:var(--text); border:1px solid var(--edge); padding:2px 8px; cursor:pointer; font:inherit; }
  input[type=text] { cursor:text; background:#0d1118; }
  button:hover { background:#35426a; } button.on { background:#4a5a92; border-color:var(--accent); }
  #top { position:fixed; left:0; right:0; top:0; height:34px; background:var(--panel); border-bottom:1px solid var(--edge); display:flex; gap:8px; align-items:center; padding:0 10px; z-index:100000; overflow:hidden; white-space:nowrap; }
  #top b { color:var(--accent); } .hint { color:var(--dim); font-size:12px; }
  #info { position:fixed; left:0; right:0; bottom:0; height:56px; background:var(--panel); border-top:1px solid var(--edge); padding:3px 10px; color:var(--dim); font:12px/1.35 ui-monospace,monospace; white-space:pre; z-index:100000; overflow:hidden; }
  #desk { position:fixed; left:0; right:0; top:34px; bottom:56px; overflow:hidden; }
  .win { position:absolute; background:var(--panel); border:1px solid var(--edge); display:flex; flex-direction:column; resize:both; overflow:hidden; min-width:160px; min-height:60px; box-shadow:0 4px 14px #0008; }
  .win > header { cursor:move; background:#26304a; padding:2px 6px; display:flex; gap:6px; align-items:center; user-select:none; flex:none; }
  .win > header .t { flex:1; font-weight:600; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .win > header button { padding:0 6px; }
  .win .body { flex:1; min-height:0; overflow:auto; position:relative; background:#05070b; }
  .win .body.pad { padding:8px; background:var(--panel); }
  .win.min { resize:none; height:auto !important; min-height:0; } .win.min .body { display:none; }
  .win .body.panes { display:flex; flex-direction:column; overflow:hidden; }
  .pane { flex:1 1 0; min-height:0; overflow:auto; position:relative; background:#05070b; }
  .pane + .pane { border-top:2px solid var(--edge); }
  .pane .cvs { padding:8px; width:max-content; }
  body.shift .pane, body.shift .pane canvas { cursor:grab; } body.panning .pane, body.panning .pane canvas { cursor:grabbing; }
  .cvs { display:flex; gap:10px; }
  .stack { position:relative; flex:none; } .stack canvas { display:block; image-rendering:pixelated; }
  .stack canvas.ov { position:absolute; left:0; top:0; }
  .stack .tag { position:absolute; left:2px; top:2px; z-index:2; background:#000a; color:var(--accent); font-size:11px; padding:0 4px; pointer-events:none; }
  details.area > summary { padding:3px 8px; background:#232b3f; color:var(--dim); font-weight:600; cursor:pointer; position:sticky; top:0; z-index:1; user-select:none; }
  details.area > summary .n { float:right; color:var(--accent); font-size:11px; font-weight:400; }
  #mapcv { display:block; cursor:pointer; }
  .room { padding:2px 8px 2px 14px; cursor:pointer; display:flex; justify-content:space-between; }
  .room:hover { background:#273049; } .room.cur { background:#34406a; } .room .n { color:var(--accent); font-size:11px; }
  h3 { margin:10px 0 4px; font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; }
  h3:first-child { margin-top:0; }
  .planes { display:flex; flex-wrap:wrap; gap:4px; }
  .planes button { min-width:58px; font-weight:600; color:#000; border:2px solid transparent; }
  .planes button.on { border-color:#fff; }
  .row { display:flex; gap:6px; align-items:center; margin:3px 0; flex-wrap:wrap; }
  #fixes div { display:flex; justify-content:space-between; padding:1px 4px; cursor:pointer; font:12px ui-monospace,monospace; }
  #fixes div:hover { background:#273049; } #fixes div.sel { background:#4a5a92; outline:1px solid var(--accent); }
  .chip { display:inline-block; width:10px; height:10px; margin-right:5px; vertical-align:middle; }
  #status { color:var(--dim); margin-top:6px; }
</style>
</head>
<body>
<div id="top">
  <b id="title">no room</b><span id="screens" class="hint"></span>
  <span class="hint">|</span>
  <label>select</label><button id="selBlocks" class="on">BLOCKS (16x16)</button><button id="selTiles">TILES (8x8)</button>
  <label>zoom</label><button id="zm">-</button><span id="zv">3</span><button id="zp">+</button>
  <button id="grid" class="on">GRID</button>
  <button id="tint" class="on" title="BEFORE and AFTER tint every tile by its plane; off shows the real colours">TINT</button>
  <button id="relayout">RELAYOUT</button>
  <span class="hint">drag selects, Ctrl adds, Shift+drag (or middle button) pans, Ctrl+wheel zooms, arrows move, Esc clears</span>
</div>
<div id="desk"></div>
<div id="info"></div>

<script>
'use strict';
// StereoPlane order and the colours of PLANE TINT (source/stereo_depth.c).
const PLANES = [['kStereoHud','HUD','#ff00ff'],['kStereoFront','FRONT','#00e5ff'],['kStereoPlay','PLAY','#ff9600'],

const PLANE_BY_NAME = Object.fromEntries(PLANES.map((p, i) => [p[0], i]));
const TYPES = ['air','slope','spike air','special air','shootable air','h-extension','unused','unused','solid','door','spike','crumble','shot block','v-extension','grapple','bomb'];
const AREAS = ['Crateria','Brinstar','Norfair','Wrecked Ship','Maridia','Tourian','Ceres'];
const LAYER_NAMES = ['', 'BG1', 'BG2', 'BG3', 'sprites', 'Mode 7'];
const CORNER_NAMES = ['TL','TR','BL','BR'];
// What StereoDepth_Plane does without a hand-made fix (source/stereo_depth.c): BG1 prio 0 BACK, BG1 prio 1 PLAY,
// BG2 prio 0 FAR (the background), BG2 prio 1 PLAY (a wall: it draws over Samus).
const DEFAULT_PLANE = (layer, prio) => layer === 2 ? (prio ? 2 : 6) : prio ? 2 : 4;

// "Same as": the plane a tile would have if it were on that layer.
const SAME_AS = [['BG1 p0', 4], ['BG1 p1 / BG2 p1', 2], ['BG2 p0', 6], ['BG3 p0', 5], ['BG3 p1', 1], ['sprites', 3]];

let rooms = [], room = null, rules = [], fixHead = '';
// Tile fixes of every room: "room:layer,bx,by,corner" -> {plane, block, room}; tileFix is the current room's, "layer,bx,by,corner".
let tileFixAll = new Map(), tileFix = new Map();
// Render-priority fixes (what priority the tile is drawn with: over or under the sprites), same keys: -> {prio, block, room}.
let prioFixAll = new Map(), prioFix = new Map();
let zoom = 3, showGrid = true, tileMode = false, curPlane = 2;
let sel = { scope: 0, set: new Set() };   // keys "bx,by,corner"; scope 0 = every layer (picked on the result), 1/2 = that layer
let dragging = null, views = [], tintOn = true;
const $ = id => document.getElementById(id);
const hex = (v, n = 4) => '0x' + v.toString(16).toUpperCase().padStart(n, '0');
const tileKey = (layer, bx, by, c) => `${layer},${bx},${by},${c}`;

// ---------- the .room file ----------
function parseRoom(buf) {
  const dv = new DataView(buf), u16 = o => dv.getUint16(o, true);

    main: u16(26), sub: u16(28), mode: u16(30) & 15, bg3pri: u16(30) >> 4 & 1 };

  r.bg3 = buf.byteLength >= o + 8 ? { map: u16(o), tiles: u16(o + 2), size: u16(o + 4) } : null;
  const n = r.w * r.h, words = at => { const a = new Uint16Array(n); for (let i = 0; i < n; i++) a[i] = bank[at + i*2] | bank[at + i*2 + 1] << 8; return a; };

}

function blockTiles(r, word) {   // TL, TR, BL, BR with the block's flips, as the game builds them
  const t = r.table, i = (word & 0x3ff) * 4, a = [t[i], t[i+1], t[i+2], t[i+3]], f = word & 0xc00;
  if (f === 0x400) return [a[1]^0x4000, a[0]^0x4000, a[3]^0x4000, a[2]^0x4000];
  if (f === 0x800) return [a[2]^0x8000, a[3]^0x8000, a[0]^0x8000, a[1]^0x8000];

const tileHasInk = (r, e) => charPixels(r, e & 0x3ff).some(c => c);

// ---------- planes of a tile ----------
function ruleFor(layer, prio) { const f = rules.find(x => x.room === room.hdr && x.layer === layer && x.prio === prio); return f ? f.plane : null; }
// The priority a tile is drawn with: its own bit, or the one a fix sets (not in BEFORE).
function prioOf(layer, bx, by, corner, e, withHand) {
  if (withHand) { const t = prioFix.get(tileKey(layer, bx, by, corner)); if (t) return t.prio; }
  return e >> 13 & 1;
}
function planeOf(layer, bx, by, corner, prio, withHand) {
  if (withHand) {
    const t = tileFix.get(tileKey(layer, bx, by, corner)); if (t) return t.plane;
    const r = ruleFor(layer, prio); if (r !== null) return r;

// ---------- drawing ----------
// A tile belongs to a layer window by where its plane puts it: BACK and PLAY are BG1's planes, FAR is BG2's; any
// other plane (FRONT, MID, OBJ) leaves it on the layer it came from, and so does the plane it has by default. So a BG2 tile sent to BG1's plane leaves BG2's
// AFTER and shows in BG1's AFTER, as in mzm's workbench. BEFORE and the result always use the layer the data is on.
const PLANE_LAYER = { 4: 1, 2: 1, 6: 2 };
function ownerOf(layer, bx, by, corner, prio, kind) {
  if (kind !== 'after') return layer;

}
// kind: 'real' (the picture), 'before' (tinted by the default planes), 'after' (tinted with the rules and tile fixes).

    for (let by = 0; by < room.h; by++) for (let bx = 0; bx < room.w; bx++) {
      const tiles = blockTiles(room, words[by * room.w + bx]);

        const e = tiles[k]; if (prioOf(layer, bx, by, k, e, kind !== 'before') !== prio) continue;
        if (pane && ownerOf(layer, bx, by, k, prio, kind) !== pane) continue;

    for (let x = 0; x <= room.w; x++) { o.moveTo(x*16 + .5, 0); o.lineTo(x*16 + .5, ov.height); }
    for (let y = 0; y <= room.h; y++) { o.moveTo(0, y*16 + .5); o.lineTo(ov.width, y*16 + .5); }
    o.stroke();

  // tiles with a hand-made fix: a bar in the colour of the plane they go to (where they are drawn: see ownerOf)
  for (const [key, t] of tileFix) {
    const [l, bx, by, c] = key.split(',').map(Number);
    if (pane) {
      const words = room.layer[l], e = words && blockTiles(room, words[by * room.w + bx])[c];
      if (!e || ownerOf(l, bx, by, c, prioOf(l, bx, by, c, e, kind !== 'before'), kind) !== pane) continue;

    o.fillStyle = PLANES[t.plane][2]; o.fillRect(bx*16 + (c & 1) * 8, by*16 + (c >> 1) * 8, 8, 4);

  for (const [key, t] of prioFix) {
    const [l, bx, by, c] = key.split(',').map(Number);
    if (pane && pane !== l) continue;
    o.fillStyle = t.prio ? '#ffd54a' : '#8be9fd'; o.fillRect(bx*16 + (c & 1) * 8, by*16 + (c >> 1) * 8 + 5, 8, 3);
    o.strokeStyle = '#000'; o.lineWidth = 1; o.strokeRect(bx*16 + (c & 1) * 8 + .5, by*16 + (c >> 1) * 8 + 5.5, 7, 2);

    const [bx, by, c] = k.split(',').map(Number), x = bx*16 + (c & 1) * 8, y = by*16 + (c >> 1) * 8;

// ---------- BG3 ----------
// The effects layer (ash, fog, water, the HUD): a 2 bpp tilemap, not level data, so it is drawn whole as the game left it in
// VRAM (without its scroll), tile by tile. Only whole-layer rules apply to it: by tile priority.

// ---------- windows ----------

const DEFAULTS = { 'w-rooms': [8, 8, 230, 330], 'w-map': [8, 346, 230, 300], 'w-result': [248, 8, 540, 420], 'w-bg3': [248, 438, 540, 250], 'w-bg1': [798, 8, 460, 330], 'w-bg2': [798, 348, 460, 330], 'w-tools': [1268, 8, 330, 700] };
function makeWindow(id, title, extraHeader) {
  const w = document.createElement('div'); w.className = 'win'; w.id = id;
  const h = document.createElement('header'), t = document.createElement('span'); t.className = 't'; t.textContent = title; h.appendChild(t);
  if (extraHeader) h.appendChild(extraHeader);
  const mn = document.createElement('button'); mn.textContent = '—'; mn.title = 'minimise'; h.appendChild(mn);
  const body = document.createElement('div'); body.className = 'body';
  w.append(h, body); desk.appendChild(w);

    const e = pgroups.get(g) || { l, bx, by, prio: t.prio, cs: [] }; e.cs.push(c); pgroups.set(g, e);
  }
  for (const e of pgroups.values()) {
    const d = document.createElement('div'), cs = e.cs.sort();
    d.dataset.l = e.l; d.dataset.bx = e.bx; d.dataset.by = e.by; d.dataset.cs = cs.join(',');
    d.innerHTML = `<span><i class="chip" style="background:${e.prio ? '#ffd54a' : '#8be9fd'}"></i>BG${e.l} ${e.bx},${e.by} ${cs.length === 4 ? '' : '[' + cs.map(i => CORNER_NAMES[i]).join(' ') + ']'}</span><span>priority ${e.prio} &times;</span>`;
    d.onclick = ev => {
      if (ev.target === d.lastChild) { for (const cc of cs) prioFixAll.delete(`${room.hdr}:${tileKey(e.l, e.bx, e.by, cc)}`); syncRoomFixes(); renderAll(); return; }
      sel = { scope: e.l, set: new Set(cs.map(cc => `${e.bx},${e.by},${cc}`)) }; updateSel(); overlayAll();
    };
    box.appendChild(d);
  }
  for (const f of rules.filter(f => f.room === room.hdr)) {
    const d = document.createElement('div'), c = PLANES[f.plane];
    d.innerHTML = `<span><i class="chip" style="background:${c[2]}"></i>${LAYER_NAMES[f.layer]} priority ${f.prio} (all)</span><span>${c[1]} &times;</span>`;
    d.onclick = ev => { if (ev.target === d.lastChild) { rules.splice(rules.indexOf(f), 1); renderAll(); } };
    box.appendChild(d);
  }
  if (!box.children.length) box.innerHTML = '<div class="hint">none</div>';
  markFixes(false);
}

// ---------- tools window ----------
function buildTools() {
  const w = makeWindow('w-tools', 'Tools'); w.body.classList.add('pad');
  w.body.innerHTML = `
    <h3>Send the selection to</h3>
    <div class="planes" id="planes"></div>
    <div class="row"><span class="hint">same as</span><span id="sameas" class="row"></span></div>
    <div class="row"><button id="apply">APPLY</button><button id="clear">CLEAR FIXES</button><button id="copy">COPY INFO</button></div>
    <div class="hint" id="selinfo">nothing selected</div>
    <h3>Draw the selection with priority</h3>
    <div class="row"><button id="pr0" title="drawn under the sprites">0 (under sprites)</button><button id="pr1" title="drawn over the sprites of priority 0-2, Samus's weapon among them">1 (over sprites)</button><button id="prk">OWN</button></div>
    <div class="hint">What the game really draws over what, not only the 3D depth: a wall marked PLAY that Samus's weapon still crosses is a priority 0 tile; priority 1 draws it over her (and BG1's priority 1 plane is PLAY by default). A bar along the bottom of a tile marks it: yellow over sprites, light blue under them.</div>
    <h3>Whole layer of this room</h3>
    <div class="row"><select id="rl"><option value="1">BG1</option><option value="2">BG2</option><option value="3">BG3</option><option value="4">sprites</option><option value="5">Mode 7</option></select>
      <select id="rp"><option value="0">priority 0</option><option value="1">priority 1</option><option value="2">priority 2</option><option value="3">priority 3</option></select></div>
    <div class="row"><select id="rpl"></select><button id="radd">ADD RULE</button></div>
    <h3>File</h3>
    <div class="row"><button id="save">SAVE source/sm_plane_fixes.inc</button></div><div id="status"></div>
    <h3>Defaults</h3>
    <div class="hint">BG1 prio 0 BACK, BG1 prio 1 PLAY, BG2 prio 0 FAR, BG2 prio 1 PLAY, BG3 prio 0 MID, BG3 prio 1 FRONT, sprites prio 3 PLAY, other sprites OBJ, Mode 7 PLAY. A tile fix (a block, or one 8x8 tile of it) replaces that for those tiles; a whole-layer rule for that layer of the room. "Same as" picks the plane a tile on that layer would get, so a tile put on the wrong layer can be sent to the right one. This changes only the tile's 3D depth: the picture still draws it where the game does. </div>
    <h3>Fixes of this room</h3><div id="fixes"></div>`;
  const pb = $('planes'), rpl = $('rpl');
  PLANES.forEach((p, i) => { const b = document.createElement('button'); b.textContent = p[1]; b.style.background = p[2]; b.onclick = () => setPlane(i); pb.appendChild(b); const o = document.createElement('option'); o.value = i; o.textContent = p[1]; rpl.appendChild(o); });
  for (const [name, pl] of SAME_AS) { const b = document.createElement('button'); b.textContent = name; b.title = 'the plane a tile on this layer gets: ' + PLANES[pl][1]; b.onclick = () => setPlane(pl); $('sameas').appendChild(b); }
  setPlane(curPlane); rpl.value = 2;
  $('apply').onclick = applyPlane; $('clear').onclick = clearFixes;
  $('pr0').onclick = () => applyPrio(0); $('pr1').onclick = () => applyPrio(1); $('prk').onclick = () => applyPrio(null);
  $('radd').onclick = () => {
    if (!room) return; const layer = +$('rl').value, prio = +$('rp').value, plane = +$('rpl').value;
    const old = rules.find(f => f.room === room.hdr && f.layer === layer && f.prio === prio);
    if ((old ? old.plane : defaultPlaneOf(layer, prio)) === plane) return status(`${LAYER_NAMES[layer]} priority ${prio} is already ${PLANES[plane][1]}: no change`);
    rules = rules.filter(f => f !== old);
    if (plane !== defaultPlaneOf(layer, prio)) rules.push({ room: room.hdr, layer, prio, plane });
    status('rule ' + (plane === defaultPlaneOf(layer, prio) ? 'removed' : 'added') + ' (not saved yet)'); renderAll();
  };
  $('copy').onclick = () => {
    if (!room) return; const lines = [`room ${hex(room.hdr)} (${AREAS[room.area]}) ${room.w}x${room.h} blocks, BG2 ${room.layer[2] ? 'is level data' : 'is not level data'}`];
    for (const k of [...sel.set].slice(0, 60)) { const [bx, by, c] = k.split(',').map(Number); lines.push(`block ${bx},${by} tile ${CORNER_NAMES[c]}`); for (const l of [1, 2]) if (room.layer[l]) lines.push('  ' + tileInfo(l, bx, by, c)); }
    navigator.clipboard.writeText(lines.join('\n')); status('copied');
  };
  $('save').onclick = async () => { const r = await fetch('/api/fixes', { method: 'POST', body: fixesText() }); status(r.ok ? 'saved' : 'save failed'); };
}
function setPlane(i) { curPlane = i; document.querySelectorAll('#planes button').forEach((b, j) => b.classList.toggle('on', j === i)); }

// ---------- rooms ----------
async function loadRoom(i) {
  const r = rooms[i], buf = await (await fetch('/rooms/' + r.file)).arrayBuffer();
  room = parseRoom(buf); sel = { scope: 0, set: new Set() }; updateSel(); syncRoomFixes();
  const on = n => ['BG1','BG2','BG3','BG4','OBJ'].map((nm, b) => (n >> b & 1) ? nm : '').filter(Boolean).join(' ') || '-';
  $('title').textContent = `${r.area_name} ${hex(r.room)}  ${r.w}x${r.h} blocks${r.bg2 ? '' : '  (BG2 not level data)'}`;
  $('screens').textContent = `mode ${room.mode}${room.bg3pri ? ', BG3 prio' : ''}   main: ${on(room.main)}   sub: ${on(room.sub)}`;
  // the layers the game really shows in this room; the others are only data
  for (const l of [1, 2]) { const cb = $('show' + l); if (cb) cb.checked = !!(room.layer[l] && ((room.main | room.sub) >> (l - 1) & 1)); }
  const res = views.find(v => !v.layer); if (res) res.layers = [1, 2].filter(x => $('show' + x).checked);
  openAreas.add(r.area); saveAreas(); mapArea = r.area;
  renderAll();
  const cur = document.querySelector('.room.cur'); if (cur) cur.scrollIntoView({ block: 'nearest' });
}
const openAreas = new Set(JSON.parse(localStorage.getItem('smwb.areas') || '[0]'));
const saveAreas = () => localStorage.setItem('smwb.areas', JSON.stringify([...openAreas]));
const fixCount = hdr => rules.filter(x => x.room === hdr).length + [...tileFixAll.values()].filter(x => x.room === hdr).length + [...prioFixAll.values()].filter(x => x.room === hdr).length;
function buildList(filter = '') {
  const box = $('list'); if (!box) return; const keep = box.parentNode.scrollTop; box.innerHTML = ''; const f = filter.toLowerCase();
  const byArea = new Map();
  rooms.forEach((r, i) => {
    if (f && !(hex(r.room).toLowerCase().includes(f) || r.area_name.toLowerCase().includes(f))) return;
    if (!byArea.has(r.area)) byArea.set(r.area, []);
    byArea.get(r.area).push(i);
  });
  for (const [area, idx] of byArea) {   // one folder per area; a search opens every folder it finds something in
    const d = document.createElement('details'); d.className = 'area'; d.open = !!f || openAreas.has(area);
    const fx = idx.reduce((n, i) => n + fixCount(rooms[i].room), 0);
    d.innerHTML = `<summary>${rooms[idx[0]].area_name} <span class="n">${fx ? fx + ' fix · ' : ''}${idx.length}</span></summary>`;
    d.addEventListener('toggle', () => { if (f) return; if (d.open) openAreas.add(area); else openAreas.delete(area); saveAreas(); });
    for (const i of idx) {
      const r = rooms[i], cnt = fixCount(r.room);
      const e = document.createElement('div'); e.className = 'room' + (room && room.hdr === r.room ? ' cur' : ''); e.dataset.i = i;
      e.innerHTML = `<span>${hex(r.room)}  <span class="hint">${r.w / 16}x${r.h / 16}</span></span><span class="n">${cnt ? cnt + ' fix' : ''}</span>`;
      e.onclick = () => loadRoom(i); d.appendChild(e);
    }
    box.appendChild(d);
  }
  box.parentNode.scrollTop = keep;
}
function buildRoomsWindow() {
  const w = makeWindow('w-rooms', 'Rooms'); w.body.style.background = 'var(--panel)';
  w.body.innerHTML = '<div style="padding:6px"><input type="text" id="search" placeholder="room (hex) or area" style="width:100%"></div><div id="list"></div>';
  $('search').oninput = e => buildList(e.target.value);
}

// ---------- area map ----------
// Every room is a rectangle of map cells (from the ROM's room headers, see serve.py --rom); click one to open it.
let mapArea = 0, mapGeom = null, mapLast = null;
function buildMapWindow() {
  const sel = document.createElement('select'); sel.id = 'maparea';
  AREAS.forEach((n, i) => { const o = document.createElement('option'); o.value = i; o.textContent = n; sel.appendChild(o); });
  sel.onchange = () => { mapArea = +sel.value; drawMap(); };
  const w = makeWindow('w-map', 'Map', sel);
  w.body.style.background = 'var(--panel)';
  w.body.innerHTML = '<div id="mapmsg" class="hint" style="padding:6px"></div><canvas id="mapcv"></canvas>';
  const cv = $('mapcv');
  const at = ev => {
    if (!mapGeom) return null; const r = cv.getBoundingClientRect(), g = mapGeom;
    const cx = Math.floor((ev.clientX - r.left) / g.cell) + g.minx, cy = Math.floor((ev.clientY - r.top) / g.cell) + g.miny;
    return { cx, cy, hits: g.rooms.filter(q => cx >= q.map[0] && cx < q.map[0] + q.map[2] && cy >= q.map[1] && cy < q.map[1] + q.map[3])
      .sort((a, b) => a.map[2] * a.map[3] - b.map[2] * b.map[3]) };
  };
  cv.onclick = ev => {
    const h = at(ev); if (!h || !h.hits.length) return;
    // cells covered by several rooms: the smallest first, then each further click takes the next one
    let k = 0; if (mapLast && mapLast.cx === h.cx && mapLast.cy === h.cy) { const j = h.hits.findIndex(q => room && q.room === room.hdr); k = (j + 1) % h.hits.length; }
    mapLast = { cx: h.cx, cy: h.cy }; loadRoom(rooms.indexOf(h.hits[k]));
  };
  cv.onmousemove = ev => {
    const h = at(ev); if (!h) return;
    $('info').textContent = h.hits.length ? 'map cell ' + h.cx + ',' + h.cy + ': ' + h.hits.map(q => `${hex(q.room)} (${q.w / 16}x${q.h / 16})`).join('  ') + (h.hits.length > 1 ? '   (click again for the next)' : '') : 'map cell ' + h.cx + ',' + h.cy;
  };
  new ResizeObserver(() => drawMap()).observe(w.win);
}
function drawMap() {
  const cv = $('mapcv'); if (!cv) return;
  const rs = rooms.filter(r => r.area === mapArea && r.map), msg = $('mapmsg'), body = cv.parentNode;
  $('maparea').value = mapArea;
  if (!rs.length) {
    cv.width = cv.height = 1; mapGeom = null;
    msg.textContent = rooms.some(r => r.map) ? 'no exported rooms in this area' : 'room positions come from the ROM: start with ./run_workbench.sh (or serve.py --rom)';
    return;
  }
  msg.textContent = '';
  const minx = Math.min(...rs.map(r => r.map[0])), maxx = Math.max(...rs.map(r => r.map[0] + r.map[2]));
  const miny = Math.min(...rs.map(r => r.map[1])), maxy = Math.max(...rs.map(r => r.map[1] + r.map[3]));
  const cell = Math.max(3, Math.min(24, Math.floor((body.clientWidth - 2) / (maxx - minx))));
  cv.width = (maxx - minx) * cell; cv.height = (maxy - miny) * cell; mapGeom = { cell, minx, miny, rooms: rs };
  const c = cv.getContext('2d'); c.fillStyle = '#05070b'; c.fillRect(0, 0, cv.width, cv.height);
  c.font = '10px ui-monospace,monospace'; c.textBaseline = 'top';
  const order = [...rs].sort((a, b) => b.map[2] * b.map[3] - a.map[2] * a.map[3]);   // big ones first: small rooms stay on top
  for (const r of order) {
    const x = (r.map[0] - minx) * cell, y = (r.map[1] - miny) * cell, w = r.map[2] * cell, h = r.map[3] * cell, cur = room && room.hdr === r.room;
    c.fillStyle = cur ? '#8a7a20' : `hsl(${(rooms.indexOf(r) * 47) % 360},35%,${fixCount(r.room) ? 34 : 24}%)`; c.fillRect(x, y, w, h);
    c.strokeStyle = cur ? '#ffd54a' : '#9fb0d0'; c.lineWidth = cur ? 2 : 1; c.strokeRect(x + .5, y + .5, w - 1, h - 1);
    if (fixCount(r.room)) { c.fillStyle = '#3cc83c'; c.fillRect(x + w - 6, y + 2, 4, 4); }
    if (w >= 34 && h >= 12) { c.fillStyle = '#fff'; c.fillText(r.room.toString(16).toUpperCase(), x + 3, y + 3); }
  }
}

async function init() {
  buildRoomsWindow();
  buildMapWindow();
  makeView('w-result', 'Result', 0, 'REAL');
  makeView('w-bg1', 'BG1', 1, 'BEFORE|AFTER');
  makeView('w-bg2', 'BG2', 2, 'BEFORE|AFTER');
  makeView('w-bg3', 'BG3 (effects)', 3, 'BEFORE|AFTER');
  buildTools();
  rooms = (await (await fetch('/api/rooms')).json()).sort((a, b) => a.area - b.area || a.room - b.room);
  parseFixes(await (await fetch('/api/fixes')).text()); buildList();
  $('zp').onclick = () => zoomTo(zoom + 1); $('zm').onclick = () => zoomTo(zoom - 1);
  $('tint').onclick = e => { tintOn = !tintOn; e.target.classList.toggle('on', tintOn); renderAll(); };
  $('grid').onclick = e => { showGrid = !showGrid; e.target.classList.toggle('on', showGrid); overlayAll(); };
  $('selBlocks').onclick = () => { tileMode = false; $('selBlocks').classList.add('on'); $('selTiles').classList.remove('on'); };
  $('selTiles').onclick = () => { tileMode = true; $('selTiles').classList.add('on'); $('selBlocks').classList.remove('on'); };
  $('relayout').onclick = () => { localStorage.removeItem(layoutKey); location.reload(); };
  if (rooms.length) loadRoom(0);
}
init();
</script>
</body>
